<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">CDF — Local Field Desk</title>
  <desc id="desc">CDF is an offline-first desktop Agent workstation that keeps projects, scenes, workflows, and artifacts in one local context.</desc>

  <rect width="1200" height="380" rx="28" fill="#F7F2EA"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#D9CFC4" stroke-width="2"/>

  <g id="title-block"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="64" y="48" width="6" height="28" rx="3" fill="#C84635"/>
    <text x="86" y="69" fill="#756A61" font-size="18" font-weight="650" letter-spacing="1.4">
      OFFLINE-FIRST DESKTOP AGENT WORKSTATION
    </text>
    <line x1="64" y1="92" x2="666" y2="92" stroke="#D9CFC4" stroke-width="2"/>

    <text x="60" y="184" fill="#292420" font-size="88" font-weight="760" letter-spacing="-3">CDF</text>
    <text x="64" y="231" fill="#292420" font-size="36" font-weight="650" letter-spacing="-0.8">
      One local desk for serious work with AI.
    </text>
    <text x="64" y="269" fill="#655B54" font-size="21" font-weight="470">
      Projects, scenes, Agents, workflows, and artifacts—kept in context.
    </text>

    <g id="scene-labels" font-size="18" font-weight="620">
      <rect x="64" y="307" width="126" height="38" rx="10" fill="#EEE6DC"/>
      <text x="84" y="332" fill="#403934">GENERAL</text>
      <rect x="202" y="307" width="136" height="38" rx="10" fill="#EEE6DC"/>
      <text x="222" y="332" fill="#403934">RESEARCH</text>
      <rect x="350" y="307" width="156" height="38" rx="10" fill="#F2DDD6"/>
      <text x="370" y="332" fill="#9D3328">WORKFLOWS</text>
    </g>
  </g>

  <g id="local-field-desk"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="716" y="38" width="424" height="304" rx="20" fill="#FFFCF7" stroke="#CFC4B8" stroke-width="2"/>
    <path d="M716 78H1140" stroke="#D9CFC4" stroke-width="2"/>
    <circle cx="742" cy="58" r="6" fill="#C84635"/>
    <circle cx="762" cy="58" r="6" fill="#D8B04D"/>
    <circle cx="782" cy="58" r="6" fill="#6A9A71"/>
    <text x="819" y="65" fill="#756A61" font-size="16" font-weight="650" letter-spacing="0.8">
      LOCAL FIELD DESK
    </text>

    <rect x="716" y="78" width="112" height="264" fill="#F0E8DD"/>
    <text x="734" y="101" fill="#756A61" font-size="14" font-weight="650">PROJECT</text>
    <text x="734" y="118" fill="#756A61" font-size="14" font-weight="650">LEDGER</text>
    <rect x="732" y="126" width="80" height="34" rx="8" fill="#FFFCF7"/>
    <rect x="732" y="126" width="4" height="34" rx="2" fill="#C84635"/>
    <text x="746" y="148" fill="#342F2B" font-size="17" font-weight="650">Project</text>
    <text x="734" y="190" fill="#756A61" font-size="16">General</text>
    <text x="734" y="221" fill="#756A61" font-size="16">Research</text>
    <text x="734" y="252" fill="#756A61" font-size="16">Workflows</text>

    <rect x="828" y="78" width="212" height="264" fill="#FFFCF7"/>
    <text x="850" y="108" fill="#756A61" font-size="16" font-weight="650">SCENE DESK</text>
    <rect x="850" y="128" width="168" height="58" rx="10" fill="#F7F2EA" stroke="#DED5CA"/>
    <rect x="850" y="128" width="5" height="58" rx="2.5" fill="#C84635"/>
    <text x="869" y="153" fill="#342F2B" font-size="18" font-weight="650">Master Agent</text>
    <text x="869" y="174" fill="#756A61" font-size="15">active project context</text>
    <path d="M934 186V214" fill="none" stroke="#B7AAA0" stroke-width="2"/>
    <path d="M934 214H885V232M934 214H983V232" fill="none" stroke="#B7AAA0" stroke-width="2"/>
    <rect x="850" y="232" width="80" height="52" rx="9" fill="#EEE6DC"/>
    <text x="868" y="255" fill="#403934" font-size="16" font-weight="650">Skills</text>
    <text x="864" y="274" fill="#756A61" font-size="12">scene set</text>
    <rect x="938" y="232" width="80" height="52" rx="9" fill="#F2DDD6"/>
    <text x="951" y="255" fill="#9D3328" font-size="16" font-weight="650">Stages</text>
    <text x="956" y="274" fill="#756A61" font-size="14">gated</text>
    <rect x="850" y="300" width="168" height="22" rx="7" fill="#E8E0D6"/>
    <rect x="850" y="300" width="116" height="22" rx="7" fill="#C84635"/>

    <rect x="1040" y="78" width="100" height="264" fill="#F4EDE4"/>
    <text x="1053" y="108" fill="#756A61" font-size="16" font-weight="650">AUX BAY</text>
    <rect x="1054" y="128" width="72" height="68" rx="9" fill="#FFFCF7" stroke="#DED5CA"/>
    <text x="1067" y="154" fill="#403934" font-size="16" font-weight="650">Files</text>
    <line x1="1067" y1="168" x2="1112" y2="168" stroke="#CFC4B8" stroke-width="2"/>
    <line x1="1067" y1="181" x2="1098" y2="181" stroke="#CFC4B8" stroke-width="2"/>
    <rect x="1054" y="208" width="72" height="92" rx="9" fill="#FFFCF7" stroke="#DED5CA"/>
    <text x="1067" y="234" fill="#403934" font-size="16" font-weight="650">Activity</text>
    <circle cx="1070" cy="254" r="4" fill="#C84635"/>
    <line x1="1081" y1="254" x2="1112" y2="254" stroke="#CFC4B8" stroke-width="2"/>
    <circle cx="1070" cy="274" r="4" fill="#6A9A71"/>
    <line x1="1081" y1="274" x2="1104" y2="274" stroke="#CFC4B8" stroke-width="2"/>
  </g>
</svg>
