name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(jq -r .version package.json)
          echo "tag=$TAG package.json=$PACKAGE_VERSION"
          if [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::Version mismatch — tag '$TAG' must equal package.json ($PACKAGE_VERSION)"
            exit 1
          fi

  package:
    name: Package ${{ matrix.name }}
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-latest
            artifact_name: CDF-windows-x86_64
            builder_args: --win --x64
            artifact_path: |
              dist/*.exe
              dist/*.msi
              dist/*.blockmap
          - name: Windows ARM64
            runner: windows-11-arm
            artifact_name: CDF-windows-arm64
            builder_args: --win --arm64
            artifact_path: |
              dist/*.exe
              dist/*.msi
              dist/*.blockmap
          - name: macOS x86_64
            runner: macos-15-intel
            artifact_name: CDF-macos-x86_64
            builder_args: --mac --x64
            artifact_path: |
              dist/*.dmg
              dist/*.blockmap
          - name: macOS ARM64
            runner: macos-15
            artifact_name: CDF-macos-arm64
            builder_args: --mac --arm64
            artifact_path: |
              dist/*.dmg
              dist/*.blockmap
          - name: Linux x86_64
            runner: ubuntu-22.04
            artifact_name: CDF-linux-x86_64
            builder_args: --linux --x64
            artifact_path: |
              dist/*.deb
              dist/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不指定 version：自动读取 package.json 的 packageManager 字段（pnpm@11.5.1）

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ matrix.artifact_name }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Build distributable
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
          find release-assets -type f -print0 \
            | xargs -0 gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber
